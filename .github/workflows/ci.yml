name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Version sync (version.ts / package.json / lockfiles / CHANGELOG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/bump-version.js --check

  client:
    name: Client (lint, types, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # Fails on any ESLint error not baselined in eslint-suppressions.json.
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  server:
    name: Server (types, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # Placeholder only: prisma generate / unit tests never connect to a database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      # The server program outgrows Node's default heap; the Dockerfile build raises it the same way.
      - run: npx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      # Unit tests only; integration tests run in the `integration` job below.
      - run: npm test
      # Business-day helpers must not depend on the host TZ: rerun them in WIB (runner is UTC).
      - run: TZ=Asia/Jakarta npx vitest run src/utils/__tests__/businessDate.test.ts src/utils/__tests__/fiscalYear.test.ts
      # Katalog tool AIRA/MCP: drift guard (route <-> registry, docs/ai-tools mutakhir).
      - run: npm run ai-tools:check

  integration:
    name: Server integration (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      # Test-only secret; the harness signs its own tokens with it.
      JWT_SECRET: ci-integration-jwt-secret-0123456789abcdef
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      # The restore integration test runs the real pg_dump/psql; they must match the server (16).
      - name: Install PostgreSQL 16 client
        working-directory: .
        # ubuntu-latest no longer ships postgresql-client-16, so take it from the PGDG repository.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          # The runner image also has a newer client; its pg_dump writes settings a 16 server rejects.
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          pg_dump --version
          psql --version
      - run: npm ci
      - run: npx prisma generate
      # Same order as docker-app-entrypoint.sh: migrations, loose SQL, then the seed.
      - run: npx prisma migrate deploy
      - run: node prisma/apply-loose-sql.mjs
      - run: npm run seed
      # Chat isolation (IDOR, admin), confirmation cards, posting and stock flows against a real DB.
      - run: npm run test:integration
